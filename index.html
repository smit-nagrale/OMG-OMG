<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
  :root{
    --ink:#081310;
    --ink-2:#0c1a15;
    --line:#25392c;
    --text:#EDEAE0;
    --dim:#7E9284;
    --gold:#C79A56;
    --gold-dim:#8C6530;
    --err:#A45C42;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at 50% 20%, #0d2018 0%, transparent 60%),
      linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--text);
    font-family:'Fraunces',serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .glow{
    position:fixed; inset:0; pointer-events:none; z-index:1;
    background: radial-gradient(600px circle at var(--x,50%) var(--y,50%), rgba(199,154,86,0.12), transparent 60%);
  }

  .screen{
    position:absolute; z-index:2;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:34px;
    opacity:0;
    pointer-events:none;
    transition:opacity .7s ease;
    padding:24px;
    text-align:center;
  }
  .screen.active{opacity:1;pointer-events:auto;}

  .eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:11px;
    letter-spacing:.35em;
    text-transform:uppercase;
    color:var(--dim);
  }
  .title-main{
    font-size:clamp(30px,6vw,54px);
    font-weight:300;
    letter-spacing:.02em;
    color:var(--text);
  }
  .title-main em{
    font-style:italic;
    font-weight:400;
    color:var(--gold);
  }
  .enter-link{
    margin-top:4px;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold-dim);
    background:none;
    border:none;
    border-bottom:1px solid var(--gold-dim);
    padding:6px 2px;
    cursor:pointer;
    transition:color .3s ease,border-color .3s ease;
  }
  .enter-link:hover{color:var(--gold);border-color:var(--gold);}

  .prove{
    width:min(320px,88vw);
    display:flex;
    flex-direction:column;
    gap:30px;
  }
  .prove-title{
    font-size:26px;
    font-style:italic;
    font-weight:400;
    color:var(--text);
    text-align:center;
  }
  .field{ text-align:left; }
  .field-label{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:10px;
    letter-spacing:.25em;
    text-transform:uppercase;
    color:var(--dim);
    margin-bottom:10px;
    display:block;
  }
  input[type="password"]{
    width:100%;
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    color:var(--text);
    font-family:'Fraunces',serif;
    font-size:17px;
    letter-spacing:.06em;
    padding:6px 2px 12px;
    outline:none;
    transition:border-color .3s ease;
  }
  input[type="password"]:focus{border-color:var(--gold-dim);}

  .captcha-box{
    display:flex;
    align-items:center;
    gap:14px;
    cursor:pointer;
    user-select:none;
  }
  .tick{
    width:22px; height:22px; min-width:22px;
    border:1px solid var(--dim);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .25s ease, background .25s ease;
  }
  .tick svg{width:12px; height:12px; opacity:0; transform:scale(.5); transition:opacity .25s ease, transform .25s ease;}
  .tick svg path{stroke:var(--ink); stroke-width:3; fill:none;}
  .captcha-box.checking .tick{border-color:var(--gold-dim);}
  .captcha-box.checking .tick::after{
    content:''; width:11px; height:11px; border:1.5px solid var(--gold-dim); border-top-color:transparent;
    border-radius:50%; animation:spin .7s linear infinite;
  }
  .captcha-box.verified .tick{background:var(--gold); border-color:var(--gold);}
  .captcha-box.verified .tick svg{opacity:1; transform:scale(1);}
  @keyframes spin{to{transform:rotate(360deg);}}
  .captcha-label{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:13px;
    letter-spacing:.03em;
    color:var(--dim);
    transition:color .25s ease;
  }
  .captcha-box.verified .captcha-label{color:var(--text);}

  .submit-btn{
    margin-top:4px;
    background:none;
    border:none;
    border-bottom:1px solid var(--gold-dim);
    color:var(--gold-dim);
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:13px;
    letter-spacing:.2em;
    text-transform:uppercase;
    padding:8px 2px;
    cursor:pointer;
    transition:color .3s ease,border-color .3s ease;
    align-self:center;
  }
  .submit-btn:hover{color:var(--gold);border-color:var(--gold);}
  .error-msg{
    font-family:'Inter',sans-serif;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--err);
    text-align:center;
    min-height:14px;
  }
  .back-link{
    text-align:center;
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:10px;
    letter-spacing:.15em;
    color:var(--dim);
    background:none;border:none;cursor:pointer;
    text-transform:uppercase;
  }
  .back-link:hover{color:var(--text);}

  .home{
    width:min(760px,92vw);
    text-align:left;
  }
  .home-eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:11px;
    letter-spacing:.3em;
    color:var(--dim);
    text-transform:uppercase;
    margin-bottom:12px;
  }
  .home h1{
    font-size:clamp(30px,5vw,46px);
    font-weight:300;
    margin:0 0 40px 0;
    color:var(--text);
  }
  .home h1 em{color:var(--gold);font-style:italic;font-weight:400;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:1px;
    background:var(--line);
  }
  .tile{
    background:var(--ink);
    padding:30px 24px;
    min-height:130px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    transition:background .3s ease;
  }
  .tile:hover{background:var(--ink-2);}
  .tile-label{
    font-family:'Inter',sans-serif;
    font-weight:300;
    font-size:10px;
    letter-spacing:.2em;
    text-transform:uppercase;
    color:var(--gold-dim);
  }
  .tile-name{
    font-size:21px;
    font-weight:300;
    color:var(--text);
    margin-top:16px;
  }
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>

  <div class="screen active" id="screen-1">
    <div class="title-main">Only for <em>HIM</em></div>
    <button class="enter-link" onclick="go(1,2)">I am him</button>
  </div>

  <div class="screen" id="screen-2">
    <div class="prove">
      <div class="prove-title">Prove it.</div>
      <div class="field">
        <label class="field-label">Password</label>
        <input type="password" id="pw" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;">
      </div>
      <div style="display:flex; justify-content:center;">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAAD_8US4QPhlmUiPx" data-theme="dark"></div>
      </div>
      <button class="submit-btn" onclick="checkPw()">Yeh, its me</button>
      <div class="error-msg" id="err"></div>
      <button class="back-link" onclick="go(2,1)">&larr; back</button>
    </div>
  </div>


</div>

<script>
  // Password is checked server-side in functions/api/login.js against the
  // SITE_PASSWORD secret you set in Cloudflare — nothing sensitive lives here.

  document.addEventListener('mousemove', (e) => {
    document.documentElement.style.setProperty('--x', e.clientX + 'px');
    document.documentElement.style.setProperty('--y', e.clientY + 'px');
  });

  function go(from,to){
    document.getElementById('screen-'+from).classList.remove('active');
    document.getElementById('screen-'+to).classList.add('active');
    document.getElementById('err').textContent = '';
  }

  async function checkPw(){
    const pw = document.getElementById('pw').value;
    const err = document.getElementById('err');
    const btn = document.querySelector('.submit-btn');

    const captchaResponse = document.querySelector('[name="cf-turnstile-response"]')?.value || '';
    if(captchaResponse.length === 0){
      err.textContent = "complete the captcha first.";
      return;
    }

    btn.textContent = 'Checking...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ password: pw, turnstileToken: captchaResponse })
      });
      const data = await res.json();

      if (data.ok) {
        window.location.href = '/vault/';
      } else {
        err.textContent = "wrong password.";
        btn.textContent = 'Yeh, its me';
      }
    } catch (e) {
      err.textContent = "something went wrong, try again.";
      btn.textContent = 'Yeh, its me';
    }
  }
</script>
</body>
</html>
