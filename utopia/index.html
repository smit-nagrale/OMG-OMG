<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utopia</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#081310; --ink-2:#0c1a15; --line:#25392c;
    --text:#EDEAE0; --dim:#7E9284; --gold:#C79A56; --gold-dim:#8C6530;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{ height:100%; }
  body{
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--text); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }

  .gear{
    position:fixed; top:24px; right:24px; width:38px; height:38px;
    border:1px solid var(--line); border-radius:50%; display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--dim); transition:all .25s ease; z-index:20;
  }
  .gear:hover{ border-color:var(--gold-dim); color:var(--gold-dim); transform:rotate(35deg); }
  .gear svg{ width:18px; height:18px; }

  .gear-tooltip{
    position:fixed; top:70px; right:24px; background:var(--ink-2); border:1px solid var(--line);
    border-radius:8px; padding:8px; min-width:180px;
    opacity:0; pointer-events:none; transform:translateY(-6px); transition:all .25s ease; z-index:20;
  }
  .gear-tooltip.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .gear-tooltip a, .gear-tooltip .disabled{
    display:block; padding:10px 12px; border-radius:6px; font-size:13px; text-decoration:none;
    color:var(--text); transition:background .2s ease;
  }
  .gear-tooltip a:hover{ background:rgba(199,154,86,0.08); }
  .gear-tooltip .disabled{ color:var(--dim); cursor:default; }
  .gear-tooltip .disabled small{ display:block; font-size:10px; margin-top:2px; }

  /* ---- stage 1: two boxes ---- */
  .stage{ text-align:center; }
  .brand{ font-family:'Fraunces',serif; font-style:italic; font-size:16px; color:var(--gold-dim); margin-bottom:40px; }

  .boxes{ display:flex; gap:18px; }
  .box{
    width:200px; height:240px; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; cursor:pointer;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
    position:relative; overflow:hidden;
  }
  .box:hover{ transform:translateY(-6px); }

  .box.light{ background:var(--text); color:var(--ink); }
  .box.light:hover{ box-shadow:0 20px 40px rgba(237,234,224,0.15); }
  .box.dark{ background:#050805; color:#5a6b60; cursor:not-allowed; }
  .box.dark:hover{ transform:none; }

  .box-label{ font-family:'Fraunces',serif; font-weight:500; font-size:24px; }
  .box-sub{ font-family:'Inter',sans-serif; font-size:11px; letter-spacing:.1em; text-transform:uppercase; opacity:.6; }

  /* ---- stage 2: light room chooser ---- */
  .light-room{ display:none; text-align:center; }
  .light-room.show{ display:block; animation:fadeUp .4s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

  .back{
    position:fixed; top:24px; left:24px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); cursor:pointer; border-bottom:1px solid var(--dim); z-index:20;
  }
  .back:hover{ color:var(--text); border-color:var(--text); }

  .room-links{ display:flex; gap:18px; }
  .room-link{
    width:200px; height:160px; border:1px solid var(--line); border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif; font-size:20px; font-weight:500; color:var(--text);
    text-decoration:none; transition:all .3s ease;
  }
  .room-link:hover{ border-color:var(--gold); background:rgba(199,154,86,0.05); }
</style>
</head>
<body>

  <div class="gear" id="gear">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
    </svg>
  </div>
  <div class="gear-tooltip" id="gearTip">
    <a href="/logs/">Access Log</a>
    <div class="disabled">Edit Constitution<small>coming soon</small></div>
  </div>

  <div class="stage" id="stage1">
    <div class="brand">Utopia</div>
    <div class="boxes">
      <div class="box light" onclick="enterLight()">
        <div class="box-label">Light</div>
        <div class="box-sub">enter</div>
      </div>
      <div class="box dark">
        <div class="box-label">Dark</div>
        <div class="box-sub">available end of month</div>
      </div>
    </div>
  </div>

  <div class="light-room" id="stage2">
    <div class="back" onclick="backToStage1()">&larr; back</div>
    <div class="room-links">
      <a class="room-link" href="/dreams/">Dream<br>Checklist</a>
      <a class="room-link" href="/constitution/">Constitution</a>
    </div>
  </div>

<script>
  const gear = document.getElementById('gear');
  const gearTip = document.getElementById('gearTip');
  gear.addEventListener('click', ()=> gearTip.classList.toggle('show'));

  function enterLight(){
    document.getElementById('stage1').style.display = 'none';
    document.getElementById('stage2').classList.add('show');
  }
  function backToStage1(){
    document.getElementById('stage2').classList.remove('show');
    document.getElementById('stage1').style.display = 'block';
  }
</script>
</body>
</html>
