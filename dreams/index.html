<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#081310; --ink-2:#0c1a15; --line:#25392c;
    --text:#EDEAE0; --dim:#7E9284; --gold:#C79A56; --gold-dim:#8C6530;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    padding:34px clamp(20px,5vw,60px) 100px;
  }
  a.key{ position:fixed; top:24px; left:24px; color:var(--dim); text-decoration:none; font-size:11px; letter-spacing:.1em; text-transform:uppercase; border-bottom:1px solid var(--dim);}
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,4vw,40px); margin:50px 0 30px; }

  /* ---- compact draggable list (default view) ---- */
  .list{ display:flex; flex-direction:column; max-width:680px; border-top:1px solid var(--line); }
  .row{
    display:flex; align-items:center; gap:14px; padding:16px 4px;
    border-bottom:1px solid var(--line); cursor:grab; transition:background .2s ease, opacity .2s ease;
  }
  .row:hover{ background:rgba(199,154,86,0.04); }
  .row.dragging{ opacity:.4; cursor:grabbing; }
  .check{
    width:20px; height:20px; min-width:20px; border:1px solid var(--dim); border-radius:5px;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s ease;
  }
  .check.checked{ background:var(--gold); border-color:var(--gold); }
  .check svg{ width:12px; height:12px; opacity:0; }
  .check.checked svg{ opacity:1; }
  .check svg path{ stroke:var(--ink); stroke-width:3; fill:none; }
  .row-title{ font-family:'Fraunces',serif; font-size:18px; font-weight:500; flex:1; cursor:pointer; }
  .row.checked .row-title{ color:var(--dim); text-decoration:line-through; }
  .row-arrow{ color:var(--dim); font-size:13px; cursor:pointer; }

  /* ---- full article view (opened) ---- */
  .article{ display:none; max-width:680px; }
  .article.open{ display:block; animation:fadeUp .4s ease; }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
  .back-to-list{
    display:inline-block; margin-bottom:26px; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); cursor:pointer; border-bottom:1px solid var(--dim);
  }
  .back-to-list:hover{ color:var(--text); border-color:var(--text); }
  .article-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:24px; }
  .article-title{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(26px,4vw,36px); }
  .edit-toggle{
    background:none; border:1px solid var(--gold-dim); color:var(--gold-dim); border-radius:8px;
    padding:8px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.05em;
    white-space:nowrap; transition:all .2s ease;
  }
  .edit-toggle:hover{ color:var(--gold); border-color:var(--gold); }
  .article-body p{ font-size:15px; color:var(--dim); line-height:1.8; margin-bottom:20px; }
  .article-media{ display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; }
  .media-slot{
    width:100%; max-width:280px; height:150px; border:1px dashed var(--line); border-radius:6px;
    display:flex; align-items:center; justify-content:center; color:var(--dim); font-size:11px;
    letter-spacing:.05em; text-transform:uppercase; cursor:pointer;
  }
  .media-slot:hover{ border-color:var(--gold-dim); color:var(--gold-dim); }

  /* ---- edit panel (inside article, toggled) ---- */
  .edit-panel{ display:none; margin-top:24px; padding-top:24px; border-top:1px solid var(--line); }
  .edit-panel.open{ display:block; }
  .edit-panel textarea{
    width:100%; min-height:100px; background:var(--ink-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; outline:none; resize:vertical;
    margin-bottom:14px;
  }
  .edit-panel textarea:focus{ border-color:var(--gold-dim); }
  .edit-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .edit-actions button{
    background:none; border:1px solid var(--line); color:var(--dim); border-radius:8px;
    padding:9px 16px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.03em;
    transition:all .2s ease;
  }
  .edit-actions button:hover{ color:var(--text); border-color:var(--gold-dim); }
  .edit-actions button.primary{ border-color:var(--gold-dim); color:var(--gold-dim); }
  .edit-actions button.primary:hover{ color:var(--gold); border-color:var(--gold); }
  .edit-actions button.tick{ border-color:#4A9B6E; color:#4A9B6E; }
  .edit-actions button.tick:hover{ background:rgba(74,155,110,0.1); }

  .add-row{ margin-top:24px; display:flex; gap:10px; max-width:680px; }
  .add-row input{
    flex:1; background:var(--ink-2); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; color:var(--text); font-family:'Inter',sans-serif; font-size:14px; outline:none;
  }
  .add-row button{
    background:none; border:1px solid var(--gold-dim); color:var(--gold-dim); border-radius:8px;
    padding:0 20px; cursor:pointer; font-family:'Inter',sans-serif; font-size:13px; letter-spacing:.05em;
  }
  .add-row button:hover{ color:var(--gold); border-color:var(--gold); }
</style>
</head>
<body>
<a class="key" href="/utopia/">&larr; hub</a>
<h1>Dream Checklist</h1>

<div class="list" id="list"></div>
<div class="article" id="article"></div>

<div class="add-row" id="addRow">
  <input type="text" id="newItem" placeholder="Add a new dream...">
  <button onclick="addItem()">Add</button>
</div>

<script>
  let items = [
    { title: "Build a business that creates freedom", text: "Not just income — actual freedom over time and decisions.", checked: false },
    { title: "Master a craft worth sharing", text: "Something good enough people ask you to teach it.", checked: false },
    { title: "Travel somewhere that changes perspective", text: "Not a vacation — a place that shifts how you see things.", checked: false },
    { title: "Create something people remember", text: "Work that outlasts the moment it was made in.", checked: false },
    { title: "Develop unshakeable discipline", text: "Show up on the days motivation doesn't.", checked: false },
    { title: "Build deep, lasting relationships", text: "Few people, fully known, for the long run.", checked: false },
  ];

  const list = document.getElementById('list');
  const articleEl = document.getElementById('article');
  const addRow = document.getElementById('addRow');
  let dragIndex = null;

  function renderList(){
    list.style.display = 'flex';
    addRow.style.display = 'flex';
    articleEl.classList.remove('open');
    list.innerHTML = '';
    items.forEach((item, i)=>{
      const el = document.createElement('div');
      el.className = 'row' + (item.checked?' checked':'');
      el.draggable = true;
      el.innerHTML = `
        <div class="check ${item.checked?'checked':''}"><svg viewBox="0 0 24 24"><path d="M4 12l6 6L20 6"/></svg></div>
        <div class="row-title">${item.title}</div>
        <div class="row-arrow">&rarr;</div>
      `;
      el.querySelector('.check').onclick = (e)=>{ e.stopPropagation(); toggleCheck(i); };
      el.querySelector('.row-title').onclick = ()=> openArticle(i);
      el.querySelector('.row-arrow').onclick = ()=> openArticle(i);

      el.addEventListener('dragstart', ()=>{ dragIndex = i; el.classList.add('dragging'); });
      el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); });
      el.addEventListener('dragover', (e)=> e.preventDefault());
      el.addEventListener('drop', ()=>{
        if(dragIndex === null || dragIndex === i) return;
        const moved = items.splice(dragIndex,1)[0];
        items.splice(i,0,moved);
        renderList();
      });

      list.appendChild(el);
    });
  }

  function toggleCheck(i){
    items[i].checked = !items[i].checked;
    if(items[i].checked){
      setTimeout(()=>{
        const moved = items.splice(i,1)[0];
        items.push(moved);
        renderList();
      }, 350);
    } else {
      renderList();
    }
  }

  function openArticle(i, editMode){
    const item = items[i];
    list.style.display = 'none';
    addRow.style.display = 'none';
    articleEl.classList.add('open');
    articleEl.innerHTML = `
      <div class="back-to-list" onclick="renderList()">&larr; all dreams</div>
      <div class="article-top">
        <div class="article-title">${item.title}</div>
        <button class="edit-toggle" id="editToggle">Edit</button>
      </div>
      <div class="article-body"><p>${item.text}</p></div>
      <div class="article-media">
        <div class="media-slot">image (optional)</div>
        <div class="media-slot">voice note (optional)</div>
      </div>
      <div class="edit-panel" id="editPanel">
        <textarea id="editText">${item.text}</textarea>
        <div class="edit-actions">
          <button class="primary" onclick="saveEdit(${i})">Save text</button>
          <button onclick="alert('Image upload wires up once storage is set up.')">Add image</button>
          <button onclick="alert('Voice note wires up once storage is set up.')">Add voice note</button>
          <button class="tick" onclick="toggleCheck(${i}); openArticle(${i})">${item.checked ? 'Mark not done' : 'Mark done'}</button>
        </div>
      </div>
    `;
    document.getElementById('editToggle').onclick = ()=>{
      document.getElementById('editPanel').classList.toggle('open');
    };
    if(editMode) document.getElementById('editPanel').classList.add('open');
  }

  function saveEdit(i){
    items[i].text = document.getElementById('editText').value;
    openArticle(i, true);
  }

  function addItem(){
    const input = document.getElementById('newItem');
    if(!input.value.trim()) return;
    items.unshift({title:input.value.trim(), text:"", checked:false});
    input.value = '';
    renderList();
  }

  renderList();
</script>
</body>
</html>
