<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Log</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#081310; --ink-2:#0c1a15; --line:#25392c;
    --text:#EDEAE0; --dim:#7E9284; --gold:#C79A56; --gold-dim:#8C6530;
    --green:#4A9B6E; --red:#B85C5C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    color:var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    padding:34px clamp(20px,5vw,60px) 100px;
  }
  a.key{ position:fixed; top:24px; left:24px; color:var(--dim); text-decoration:none; font-size:11px; letter-spacing:.1em; text-transform:uppercase; border-bottom:1px solid var(--dim);}
  h1{ font-family:'Fraunces',serif; font-weight:500; font-size:clamp(28px,4vw,40px); margin:50px 0 24px; }

  .controls{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px; }
  .controls button{
    background:var(--ink-2); border:1px solid var(--line); color:var(--dim); border-radius:8px;
    padding:9px 14px; cursor:pointer; font-family:'Inter',sans-serif; font-size:12px; letter-spacing:.03em;
    transition:all .2s ease;
  }
  .controls button:hover, .controls button.active{ color:var(--gold); border-color:var(--gold-dim); }

  table{ width:100%; max-width:960px; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; color:var(--dim); font-weight:400; letter-spacing:.05em; text-transform:uppercase; font-size:10px; padding:10px 12px; border-bottom:1px solid var(--line); cursor:pointer; }
  td{ padding:12px; border-bottom:1px solid var(--line); }
  tr.new-location td{ background:rgba(199,154,86,0.05); }
  .new-tag{ font-size:10px; color:var(--gold); border:1px solid var(--gold-dim); border-radius:4px; padding:1px 6px; margin-left:8px; }
  .result{ font-size:11px; padding:3px 8px; border-radius:4px; display:inline-block; }
  .result.success{ background:rgba(74,155,110,0.15); color:var(--green); }
  .result.wrong_password, .result.failed_captcha{ background:rgba(184,92,92,0.12); color:var(--red); }
  .result.locked_out{ background:rgba(199,154,86,0.12); color:var(--gold); }
  .empty{ color:var(--dim); font-size:14px; margin-top:20px; }
</style>
</head>
<body>
<a class="key" href="/utopia/">&larr; hub</a>
<h1>Access Log</h1>

<div class="controls">
  <button id="btnTime" class="active" onclick="setSort('time')">Newest first</button>
  <button id="btnIp" onclick="setSort('ip')">Sort by IP</button>
  <button id="btnInside" onclick="setCountryFilter('inside')">Inside India only</button>
  <button id="btnOutside" onclick="setCountryFilter('outside')">Outside India only</button>
</div>

<div id="content">Loading...</div>

<h1 style="font-size:22px; margin-top:60px;">Device Trust</h1>
<p style="color:var(--dim); font-size:13px; margin-bottom:20px;">Drag an IP into Trusted to stop notifications for it. Drag back to Untrusted anytime.</p>

<div style="display:flex; gap:24px; flex-wrap:wrap; max-width:900px;">
  <div style="flex:1; min-width:260px;">
    <div style="font-family:'Fraunces',serif; font-size:15px; color:var(--dim); margin-bottom:10px;">Untrusted</div>
    <div id="untrustedCol" ondragover="event.preventDefault()" ondrop="handleDrop(event,'untrusted')"
      style="min-height:120px; border:1px dashed var(--line); border-radius:8px; padding:10px;"></div>
  </div>
  <div style="flex:1; min-width:260px;">
    <div style="font-family:'Fraunces',serif; font-size:15px; color:var(--gold); margin-bottom:10px;">Trusted</div>
    <div id="trustedCol" ondragover="event.preventDefault()" ondrop="handleDrop(event,'trusted')"
      style="min-height:120px; border:1px dashed var(--gold-dim); border-radius:8px; padding:10px;"></div>
  </div>
</div>

<script>
  let allEntries = [];
  let sortMode = 'time';
  let countryFilter = 'none'; // 'none' | 'inside' | 'outside'

  function setSort(mode){
    sortMode = mode;
    document.getElementById('btnTime').classList.toggle('active', mode==='time');
    document.getElementById('btnIp').classList.toggle('active', mode==='ip');
    render();
  }
  function setCountryFilter(mode){
    countryFilter = (countryFilter === mode) ? 'none' : mode; // click again to clear
    document.getElementById('btnInside').classList.toggle('active', countryFilter==='inside');
    document.getElementById('btnOutside').classList.toggle('active', countryFilter==='outside');
    render();
  }

  function render(){
    const content = document.getElementById('content');
    if(allEntries.length === 0){
      content.innerHTML = '<div class="empty">No login attempts recorded yet.</div>';
      return;
    }

    let entries = [...allEntries];
    if(countryFilter === 'outside'){
      entries = entries.filter(e => (e.country || '').toUpperCase() !== 'IN');
    } else if(countryFilter === 'inside'){
      entries = entries.filter(e => (e.country || '').toUpperCase() === 'IN');
    }
    if(sortMode === 'ip'){
      entries.sort((a,b) => a.ip.localeCompare(b.ip));
    } else {
      entries.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
    }

    // determine "new location" — first time this city/country combo appears, chronologically
    const chronological = [...allEntries].sort((a,b)=> new Date(a.timestamp) - new Date(b.timestamp));
    const firstSeen = new Set();
    const isFirstOccurrence = {};
    chronological.forEach(e=>{
      const locKey = `${e.city}|${e.country}`;
      if(!firstSeen.has(locKey)){
        firstSeen.add(locKey);
        isFirstOccurrence[`${e.timestamp}|${e.ip}`] = true;
      }
    });

    if(entries.length === 0){
      content.innerHTML = '<div class="empty">No entries match this filter.</div>';
      return;
    }

    let rows = entries.map(e => {
      const isNew = isFirstOccurrence[`${e.timestamp}|${e.ip}`];
      return `
        <tr class="${isNew ? 'new-location' : ''}">
          <td>${new Date(e.timestamp).toLocaleString()}</td>
          <td>${e.ip}</td>
          <td>${e.city}, ${e.region}, ${e.country} ${isNew ? '<span class="new-tag">new</span>' : ''}</td>
          <td><span class="result ${e.result}">${e.result.replace('_',' ')}</span></td>
        </tr>
      `;
    }).join('');

    content.innerHTML = `
      <table>
        <tr><th>Time</th><th>IP</th><th>Location</th><th>Result</th></tr>
        ${rows}
      </table>
    `;
  }

  fetch('/logs/api/list')
    .then(r => r.json())
    .then(data => {
      allEntries = data.entries || [];
      seenIps = [...new Set(allEntries.map(e => e.ip))];
      render();
      renderTrustColumns();
    })
    .catch(()=>{
      document.getElementById('content').innerHTML = '<div class="empty">Could not load logs.</div>';
    });

  loadTrustData();

  let trustedIps = [];
  let seenIps = [];

  function renderTrustColumns(){
    const untrustedCol = document.getElementById('untrustedCol');
    const trustedCol = document.getElementById('trustedCol');

    const untrusted = seenIps.filter(ip => !trustedIps.includes(ip));
    const trusted = trustedIps.filter(ip => seenIps.includes(ip) || true); // keep manually added even if not in recent logs

    function chip(ip){
      return `<div draggable="true" ondragstart="event.dataTransfer.setData('text/plain','${ip}')"
        style="background:var(--ink-2); border:1px solid var(--line); border-radius:6px; padding:8px 12px; margin-bottom:8px; font-size:13px; cursor:grab;">${ip}</div>`;
    }

    untrustedCol.innerHTML = untrusted.length
      ? untrusted.map(chip).join('')
      : '<div style="color:var(--dim); font-size:12px;">No untrusted IPs seen yet.</div>';

    trustedCol.innerHTML = trusted.length
      ? trusted.map(chip).join('')
      : '<div style="color:var(--dim); font-size:12px;">Drag an IP here to trust it.</div>';
  }

  function handleDrop(event, target){
    const ip = event.dataTransfer.getData('text/plain');
    if(!ip) return;

    if(target === 'trusted' && !trustedIps.includes(ip)){
      trustedIps.push(ip);
      fetch('/logs/api/known-ips', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ip })
      });
    } else if(target === 'untrusted'){
      trustedIps = trustedIps.filter(x => x !== ip);
      fetch('/logs/api/known-ips', {
        method:'DELETE', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ ip })
      });
    }
    renderTrustColumns();
  }

  function loadTrustData(){
    fetch('/logs/api/known-ips').then(r=>r.json()).then(d => {
      trustedIps = d.ips || [];
      renderTrustColumns();
    });
  }
</script>
</body>
</html>
