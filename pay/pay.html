<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan to Pay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#081310; --ink2:#0c1a15; --cream:#EDEAE0;
    --gold:#C79A56; --gold-d:#8C6530; --green:#3fae6a; --red:#c85a5a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 30%, var(--ink2), var(--ink));
    font-family:'Inter',system-ui,sans-serif; color:var(--cream);
  }
  .card{
    width:min(92vw,380px); padding:36px 28px; border-radius:18px;
    background:rgba(237,234,224,0.03); border:1px solid rgba(199,154,86,0.25);
    text-align:center; position:relative; overflow:hidden;
  }
  h1{font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 6px; color:var(--gold);}
  p.sub{margin:0 0 22px; font-size:13px; color:rgba(237,234,224,0.6);}
  #qrbox{
    background:#fff; padding:14px; border-radius:12px; display:inline-block;
  }
  .status{margin-top:18px; font-size:12px; color:rgba(237,234,224,0.5); letter-spacing:.03em;}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--gold); margin-right:6px; animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

  /* success overlay */
  .success{
    position:absolute; inset:0; background:var(--ink); display:flex; flex-direction:column;
    align-items:center; justify-content:center; opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .success.show{opacity:1; pointer-events:auto;}
  .tick-wrap{width:96px; height:96px; border-radius:50%; background:rgba(63,174,106,0.12);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px;
    transform:scale(0); animation:pop .5s cubic-bezier(.34,1.56,.64,1) forwards .1s;}
  @keyframes pop{to{transform:scale(1);}}
  svg.tick{width:52px;height:52px;}
  svg.tick path{
    fill:none; stroke:var(--green); stroke-width:6; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:48; stroke-dashoffset:48; animation:draw .5s ease forwards .45s;
  }
  @keyframes draw{to{stroke-dashoffset:0;}}
  .amt{font-family:'Fraunces',serif; font-size:34px; font-weight:600; color:var(--cream);
    opacity:0; transform:translateY(6px); animation:rise .4s ease forwards .5s;}
  .paidline{font-size:13px; color:var(--green); margin-top:8px; letter-spacing:.04em;
    opacity:0; animation:rise .4s ease forwards .65s;}
  @keyframes rise{to{opacity:1; transform:translateY(0);}}
</style>
</head>
<body>
  <div class="card">
    <h1>Scan to Pay</h1>
    <p class="sub">Open on your phone camera</p>
    <div id="qrbox"></div>
    <div class="status"><span class="dot"></span>Waiting for payment…</div>

    <div class="success" id="success">
      <div class="tick-wrap">
        <svg class="tick" viewBox="0 0 24 24"><path d="M4 12l5 5 11-11"/></svg>
      </div>
      <div class="amt" id="amt"></div>
      <div class="paidline">PAYMENT SUCCESSFUL</div>
    </div>
  </div>

<script>
  // random session id for this display
  const session = Math.random().toString(36).slice(2,10);
  const payUrl = location.origin + "/pay/enter.html?session=" + session;
  new QRCode(document.getElementById("qrbox"), {
    text: payUrl, width: 220, height: 220,
    colorDark:"#081310", colorLight:"#ffffff"
  });

  function beep(){
    try{
      const ctx = new (window.AudioContext||window.webkitAudioContext)();
      const notes = [880, 1175]; // two-tone success chime
      notes.forEach((f,i)=>{
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = "sine"; o.frequency.value = f;
        o.connect(g); g.connect(ctx.destination);
        const start = ctx.currentTime + i*0.14;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.25, start+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, start+0.32);
        o.start(start); o.stop(start+0.35);
      });
    }catch(e){}
  }

  function numToWords(n){
    // crores/lakhs formatting for INR-style amounts, falls back to plain number
    n = Number(n);
    if(!isFinite(n)) return "";
    if(n >= 1e7) return (n/1e7).toString().replace(/\.0$/,"") + " Cr";
    if(n >= 1e5) return (n/1e5).toString().replace(/\.0$/,"") + " L";
    return n.toLocaleString("en-IN");
  }

  let done = false;
  async function poll(){
    if(done) return;
    try{
      const r = await fetch("/api/status?session=" + session, {cache:"no-store"});
      if(r.ok){
        const data = await r.json();
        if(data.paid){
          done = true;
          document.getElementById("amt").textContent =
            "₹" + numToWords(data.amount) + " Paid";
          document.getElementById("success").classList.add("show");
          beep();
          return;
        }
      }
    }catch(e){}
    setTimeout(poll, 1200);
  }
  poll();
</script>
</body>
</html>
